<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Explorer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#333;
}

header{
    background:#008cba;
    color:white;
    padding:20px;
}

header h1{
    text-align:center;
}

nav{
    text-align:center;
    margin-top:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.hero{
    height:400px;
    background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h2{
    font-size:45px;
}

.hero p{
    margin-top:10px;
    font-size:18px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

section{
    padding:50px 20px;
}

section h2{
    text-align:center;
    margin-bottom:30px;
    color:#008cba;
}

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    width:280px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    padding:15px;
}

.card p{
    padding:0 15px 15px;
}

.package-box{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.package{
    background:white;
    padding:20px;
    width:250px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

.package h3{
    color:#008cba;
}

.package h4{
    color:#ff9800;
    margin:10px 0;
}

.about, .contact{
    text-align:center;
    max-width:700px;
